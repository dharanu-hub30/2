<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Wave | Application Form</title>
<link rel="stylesheet" href="windwave-styles.css">
</head>
<body>
<header>
  <h1>Wind Wave</h1>
  <p>Harnessing wind energy for smart cities</p>
  <nav aria-label="Main">
    <a href="index.html">Media Elements</a>
    <a href="windwave-application-form.html" aria-current="page">Application Form</a>
  </nav>
</header>
<main>
<div class="form-wrap">
 <div class="form-box">
  <h2>Wind Wave Application Form</h2>
  <p class="sub">Register a site for smart city wind energy.</p>
  <form id="windForm" action="#" method="post">
   <table>
    <tr><td class="label"><label for="fname">First Name:</label></td><td><input type="text" id="fname" name="firstName" required autocomplete="given-name"></td></tr>
    <tr><td class="label"><label for="lname">Last Name:</label></td><td><input type="text" id="lname" name="lastName" required autocomplete="family-name"></td></tr>
    <tr><td colspan="2"><b>Site Address</b></td></tr>
    <tr><td class="label"><label for="street">Number &amp; Street:</label></td><td><input type="text" id="street" name="street" required></td></tr>
    <tr><td class="label"><label for="city">City:</label></td><td><input type="text" id="city" name="city" required></td></tr>
    <tr><td class="label"><label for="state">State:</label></td><td><input type="text" id="state" name="state" required></td></tr>
    <tr><td class="label"><label for="zip">Pin Code:</label></td><td><input type="text" id="zip" name="zip" pattern="[0-9]{6}" maxlength="6" title="6-digit pin code" required></td></tr>
    <tr><td class="label"><label for="survey">Site Survey Date:</label></td><td><input type="date" id="survey" name="surveyDate" required></td></tr>
    <tr><td class="label"><label for="install">Installation Date:</label></td><td><input type="date" id="install" name="installDate" required></td></tr>
    <tr><td class="label"><label for="phone">Phone:</label></td><td><input type="tel" id="phone" name="phone" placeholder="(###) ###-####" pattern="[0-9()\-\s]{10,14}" required></td></tr>
    <tr><td class="label"><label for="email">E-mail Address:</label></td><td><input type="email" id="email" name="email" placeholder="name@domain.com" required></td></tr>
    <tr><td class="label"><label for="turbine">Turbine Type:</label></td><td><select id="turbine" name="turbine" required><option value="">Choose one</option><option>Horizontal axis</option><option>Vertical axis</option><option>Rooftop micro</option></select></td></tr>
    <tr><td class="label"><label for="capacity">Capacity (kW):</label></td><td><input type="number" id="capacity" name="capacity" min="1" max="100000" required></td></tr>
    <tr><td class="label"><b><label for="requests">Special Requests:</label></b></td><td><textarea id="requests" name="requests" maxlength="300" placeholder="Enter your request here"></textarea></td></tr>
    <tr><td></td><td><button type="submit">Submit</button><button type="reset">Clear</button></td></tr>
   </table>
  </form>
  <div id="thanks" role="status"></div>
 </div>
</div>
</main>
<footer>&copy; 2026 Wind Wave. Harnessing wind energy for smart cities.</footer>
<script src="windwave-script.js"></script>
</body>
</html>
