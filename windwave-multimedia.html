<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WindWave - Multimedia</title>
<style>
  body { margin: 0; font-family: "Times New Roman", serif; text-align: center; color: #0b2545; }
  h1 { margin: 16px 0 8px; color: #1f3fd0; }
  nav a { margin: 0 12px; font-size: 0.9rem; }
  hr { margin: 10px 0; border: 0; border-top: 1px solid #bbb; }
  .banner { display: block; width: 100%; max-width: 1000px; margin: 12px auto; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); width: min(1000px, 100%); margin: auto; }
  .grid > * { width: 100%; height: 300px; border: 0; background: #e8f4fc; }
  .grid video { object-fit: cover; background: #000; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>WindWave</h1>
  <p>Harnessing wind energy for the cities of tomorrow</p>
  <hr>
  <nav>
    <a href="#media">Media Elements</a>
    <a href="#brochure">Brochure</a>
    <a href="#map">Wind Farm Map</a>
  </nav>
  <hr>
  <section id="media">
    <p>Play Music:
      <audio controls>
        <source src="assets/windwave-wind.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </p>
  </section>
  <img class="banner" src="assets/windwave-banner.jpg" alt="Wind turbines over green hills">
  <div class="grid">
    <iframe id="brochure" src="assets/windwave-brochure.pdf" title="WindWave brochure (PDF)"></iframe>
    <iframe src="https://www.youtube.com/embed/ia1LJE9sOxQ" title="How wind turbines work" allowfullscreen></iframe>
    <video controls muted loop poster="assets/windwave-banner.jpg">
      <source src="assets/windwave-demo.mp4" type="video/mp4">
      Your browser does not support the video element.
    </video>
    <iframe id="map" src="https://www.google.com/maps?q=Muppandal+Wind+Farm&output=embed"
      title="Muppandal Wind Farm map" loading="lazy" allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
</body>
</html>
